    --rojo: #D80000; --naranja: #E85D00; --ambar: #B36B00; --verde: #00852F; --pista: #CFCFCF;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  html, body { margin: 0; min-height: 100%; background: #fff; }
  body {
    color: var(--tinta);
    font-family: "Nunito Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button, input { font: inherit; }
  .oculto { display: none !important; }

  /* ---------- Inicio de sesión ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  .caja { width: 100%; max-width: 420px; padding: .5rem .4rem 1.5rem; }
  .marca { text-align: center; font-weight: 900; font-size: 2.1rem; margin: 0; line-height: 1.1; }
  .marca .tc { color: var(--tinta); }
  .marca .nom { color: var(--azul); }
  .marca .mes { color: var(--celeste); font-size: 1.2rem; margin-left: .25rem; }
  .regla { border: 0; border-top: 3px solid var(--azul); margin: .9rem 0 1.2rem; }
  .mascota { display: block; width: 170px; height: 170px; margin: 0 auto; border-radius: 50%; object-fit: cover; background: #E6F1FD; }
  .bienvenida { text-align: center; color: var(--azul); font-weight: 900; font-size: 2rem; margin: 1rem 0 .1rem; }
  .sub { text-align: center; color: var(--texto2); font-weight: 600; margin: 0 0 1.3rem; }
  .campo { margin-bottom: 1.1rem; }
  .campo label { display: flex; align-items: center; gap: .55rem; font-weight: 900; color: var(--azul); font-size: 1.05rem; margin: 0 0 .45rem .1rem; }
  .campo label svg { width: 28px; height: 28px; flex: none; }
  .campo input {
    width: 100%; padding: .85rem 1rem; font-size: 1.3rem; font-weight: 800; border: 2.5px solid var(--borde);
    border-radius: 10px; background: #fff; color: var(--tinta); letter-spacing: .04em;
  }
  .campo input::placeholder { color: #6B7280; font-weight: 600; }
  .campo input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 4px rgba(0, 48, 200, .25); }
  .ayuda { text-align: center; color: var(--azul-osc); font-weight: 800; font-size: .95rem; min-height: 1.3em; margin: .2rem 0 .9rem; }
  .ayuda.error { color: var(--rojo); }
  .boton { width: 100%; border: 0; border-radius: 10px; background: var(--azul); color: #fff; font-weight: 900; font-size: 1.5rem; padding: .85rem 1rem; cursor: pointer; }
  .boton:disabled { opacity: .7; cursor: progress; }
  .boton:focus-visible, .salir:focus-visible { outline: 4px solid var(--amarillo); outline-offset: 2px; }

  /* ---------- Detalle ---------- */
  #detalle { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; padding: .6rem .6rem 2rem; }
  .cabecera { background: var(--azul); color: #fff; border-radius: 14px; padding: .9rem 1rem 1rem; position: relative; }
  .cabecera h1 { margin: 0; font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
  .cabecera .sede { color: var(--amarillo); font-weight: 900; font-size: .9rem; margin: .15rem 0 .55rem; }
  .cabecera .hola { font-weight: 900; font-size: 1.15rem; margin: 0; }
  .cabecera .codigo { font-weight: 700; font-size: .9rem; margin: 0 0 .8rem; }
  .cabecera img { position: absolute; right: .6rem; top: .5rem; width: 78px; height: 76px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; }
  .fila-cab { display: flex; gap: .5rem; align-items: stretch; flex-wrap: wrap; }
  .dia { background: #fff; color: var(--azul-osc); border-radius: 9px; padding: .35rem .6rem; display: flex; gap: .45rem; align-items: center; }
  .dia svg { width: 24px; height: 24px; flex: none; }
  .dia small { display: block; font-size: .72rem; font-weight: 800; line-height: 1.1; }
  .dia b { font-size: 1.2rem; font-weight: 900; }
  .ganando { margin-left: auto; background: var(--amarillo); color: var(--tinta); border-radius: 9px; padding: .35rem .8rem; text-align: center; }
  .ganando small { display: block; font-size: .75rem; font-weight: 900; }
  .ganando b { font-size: 1.75rem; font-weight: 900; line-height: 1.1; }
  .barra-sup { display: flex; gap: .5rem; margin: .6rem 0; }
  .chip-exp { flex: 1; background: var(--azul-osc); color: #fff; text-align: center; border-radius: 8px; font-weight: 900; padding: .4rem; }
  .salir { border: 0; background: var(--rojo); color: #fff; border-radius: 8px; padding: .4rem .9rem; font-weight: 900; cursor: pointer; display: flex; gap: .35rem; align-items: center; }
  .salir svg { width: 18px; height: 18px; }

  .tarjeta { background: #fff; border: 2.5px solid var(--borde); border-radius: 14px; padding: .8rem .9rem; margin-bottom: .7rem; }
  .tarjeta.bono { background: var(--amarillo); border-color: var(--tinta); }
  .tarjeta h3 { margin: 0; font-size: 1.08rem; font-weight: 900; line-height: 1.15; color: var(--tinta); text-transform: uppercase; }
  .desc { color: var(--texto2); font-weight: 600; font-size: .8rem; margin: .2rem 0 .55rem; line-height: 1.3; }
  .cuerpo { display: grid; grid-template-columns: 1fr auto minmax(96px, auto); gap: .6rem; align-items: center; }
  .cuerpo.sin-anillo { grid-template-columns: 1fr minmax(96px, auto); }
  .cuerpo.larga { grid-template-columns: auto 1fr; }
  .cuerpo.larga .datos { grid-column: 1 / -1; order: 2; border-top: 2px solid var(--linea); padding-top: .6rem; }
  .datos { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: .4rem .7rem; }
  .lbl { font-size: .78rem; color: var(--texto2); font-weight: 800; line-height: 1.15; }
  .val { white-space: nowrap; font-size: 1.25rem; font-weight: 900; color: var(--azul); font-variant-numeric: tabular-nums; }
  .com { border-left: 2.5px solid var(--borde); padding-left: .7rem; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: .3rem; }
  .com b { display: block; white-space: nowrap; font-size: 1.38rem; font-weight: 900; color: var(--verde); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .com .rango { font-weight: 900; font-size: .88rem; color: var(--tinta); }
  .anillo { width: 88px; height: 88px; position: relative; }
  .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anillo span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 1rem; line-height: 1.05; color: var(--tinta); font-variant-numeric: tabular-nums; }
  .anillo em { font-style: normal; font-size: .66rem; font-weight: 900; }
  .anillo.chico { width: 78px; height: 78px; }
  .anillo.chico span { font-size: .88rem; }

  .tarjeta.compacta { display: grid; grid-template-columns: 1fr auto minmax(92px, auto); gap: .6rem; align-items: center; padding: .7rem .85rem; }
  .bono .com { border-color: var(--tinta); }
  .bono .com b, .bono .val { color: var(--tinta); }
  .bono .lbl { color: var(--tinta); }
  .bono-fila { display: flex; align-items: center; gap: .5rem; margin-top: .35rem; }
  .bono-fila .val { font-size: 1.05rem; }
  .regalo { width: 36px; height: 36px; color: var(--tinta); flex: none; }

  .con-foto { display: grid; grid-template-columns: 92px 1fr; gap: .75rem; align-items: center; border-color: var(--azul); border-width: 3px; }
  .foto { width: 92px; height: 104px; object-fit: contain; border-radius: 10px; background: #fff; }
  .con-foto .datos { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .seccion { display: flex; align-items: center; gap: .5rem; color: var(--tinta); font-weight: 900; font-size: 1.3rem; margin: 1.1rem .2rem .55rem; padding-bottom: .3rem; border-bottom: 3px solid var(--azul); text-transform: uppercase; }
  .seccion svg { width: 26px; height: 26px; flex: none; color: var(--azul); }

  .tasas { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; margin-bottom: .45rem; }
  .tasa { background: var(--azul); color: #fff; text-align: center; border-radius: 7px; font-weight: 900; padding: .3rem; }
  .cajas-cob { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
  .cob { background: #fff; border: 2.5px solid var(--borde); border-radius: 12px; text-align: center; padding: .55rem .3rem; }
  .cob .dias { display: flex; flex-direction: column; align-items: center; gap: .2rem; color: var(--azul); font-weight: 900; font-size: .9rem; }
  .cal { width: 30px; height: 30px; }
  .cob .monto { font-weight: 900; font-size: 1.3rem; margin: .15rem 0 .3rem; font-variant-numeric: tabular-nums; }
  .cob:nth-child(1) .monto { color: var(--verde); }
  .cob:nth-child(2) .monto { color: var(--naranja); }
  .cob:nth-child(3) .monto { color: var(--rojo); }
  .cob .c { font-weight: 900; color: var(--tinta); }
  .total-cob { text-align: right; font-weight: 900; margin: .55rem .2rem 0; color: var(--tinta); }
  .total-cob b { color: var(--verde); }

  .resumen .linea { display: flex; justify-content: space-between; padding: .45rem 0; border-bottom: 2px solid var(--linea); font-weight: 700; font-variant-numeric: tabular-nums; }
  .resumen .linea:last-child { border-bottom: 0; font-weight: 900; font-size: 1.2rem; color: var(--verde); }
  .pie { text-align: center; color: var(--texto2); font-weight: 600; font-size: .8rem; margin-top: 1rem; }
  @media (max-width: 360px) {
    .tarjeta.compacta { grid-template-columns: 1fr auto; }
    .tarjeta.compacta .com { grid-column: 1 / -1; border-left: 0; border-top: 2.5px solid var(--tinta); padding: .4rem 0 0; }
    .con-foto { grid-template-columns: 68px 1fr; }
    .foto { width: 68px; height: 78px; }
    .cuerpo { grid-template-columns: 1fr minmax(84px, auto); }
    .cuerpo .anillo { grid-column: 1 / -1; justify-self: center; }
  }
</style>
</head>

<script>
(function () {
  const D = window.TC;
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  $("marcaNom").textContent = D.meta.marca;
  $("marcaMes").textContent = D.meta.mes;

  const soles = v => {
    const n = Number(v) || 0;
    const d = Math.abs(n) < 100 && n % 1 !== 0 ? 2 : 0;
    return "S/ " + n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const pct = v => {
    const n = (Number(v) || 0) * 100;
    return n.toLocaleString("en-US", { minimumFractionDigits: Math.abs(n) < 10 ? 2 : 1, maximumFractionDigits: Math.abs(n) < 10 ? 2 : 1 }) + "%";
  };
  const num = v => typeof v !== "number" ? esc(v) : v.toLocaleString("en-US", { maximumFractionDigits: v % 1 === 0 ? 0 : 1 });
  const fmt = (v, f) => f === "m" ? soles(v) : f === "p" ? pct(v) : num(v);
  const titulo = s => String(s).toLowerCase().replace(/(^|\s|\()\S/g, m => m.toUpperCase());
  const mesNombre = ym => {
    const m = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Set", "Oct", "Nov", "Dic"][+ym.slice(4) - 1];
    return m ? m + " " + ym.slice(0, 4) : ym;
  };

  try { const ult = localStorage.getItem("tc-codigo"); if (ult) $("cod").value = ult; } catch (e) {}

  async function abrir(cod, pin) {
    const id = hex(await crypto.subtle.digest("SHA-256", enc.encode(D.salt + "|" + cod))).slice(0, 24);
    const item = D.users[id];
    if (!item) return null;
    const base = await crypto.subtle.importKey("raw", enc.encode(cod + "|" + pin), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub64(D.salt), iterations: D.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    try {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(item[0]) }, key, ub64(item[1]));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { return null; }
  }

  $("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const cod = $("cod").value.trim().toUpperCase();
    const pin = $("pin").value.trim();
    const ayuda = $("ayuda");
    if (!cod || !/^\d{4}$/.test(pin)) {
      ayuda.textContent = "Escribe tu código y los 4 últimos dígitos de tu DNI.";
      ayuda.classList.add("error");
      return;
    }
    if (!window.crypto || !crypto.subtle) {
      ayuda.textContent = "Abre esta página desde su enlace https para poder ingresar.";
      ayuda.classList.add("error");
      return;
    }
    const btn = $("btn");
    btn.disabled = true; btn.textContent = "VERIFICANDO…";
    const r = await abrir(cod, pin).catch(() => null);
    btn.disabled = false; btn.textContent = "INGRESAR";
    if (!r) {
      ayuda.textContent = "Código o contraseña incorrectos.";
      ayuda.classList.add("error");
      $("pin").value = ""; $("pin").focus();
      return;
    }
    try { localStorage.setItem("tc-codigo", cod); } catch (e) {}
    ayuda.classList.remove("error");
    ayuda.textContent = "Tu contraseña son los últimos 4 dígitos de tu DNI";
    $("pin").value = "";
    mostrar(r);
  });

  function anillo(p, etiqueta, chico) {
    const v = Math.max(0, Number(p) || 0);
    const color = v >= 1 ? "var(--verde)" : v >= 0.8 ? "var(--naranja)" : "var(--rojo)";
    const C = 2 * Math.PI * 34;
    const lleno = Math.min(v, 1) * C;
    return `<div class="anillo ${chico ? "chico" : ""}" role="img" aria-label="Avance ${pct(v)}">
      <svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--pista)" stroke-width="11"/>
      <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${lleno} ${C}"/></svg><span>${etiqueta ? `<em>${etiqueta}</em>` : ""}${pct(v)}</span></div>`;
  }

  const ICONOS = {
    PRIORIDADES: '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3l3.6 7.6 8.2 1-6 5.7 1.6 8.2L16 21.5l-7.4 4 1.6-8.2-6-5.7 8.2-1z"/></svg>',
    COBRANZA: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="currentColor"/><text x="16" y="22" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="sans-serif">$</text></svg>',
    EJECUCION: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 17l7 7L27 8"/></svg>',
    COBERTURA: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M16 29s-9-8.5-9-15a9 9 0 0 1 18 0c0 6.5-9 15-9 15z"/><circle cx="16" cy="14" r="3.5"/></svg>'
  };
  const NOMBRE_SECCION = { PRIORIDADES: "Prioridades", COBRANZA: "Cobranzas", EJECUCION: "Ejecución", COBERTURA: "Cobertura" };

  // Concursos con foto: cada uno tiene uno o más títulos (separados por "/") y su foto.
  const clave = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
  const concursos = (D.meta.concursos || []).map(c => ({ alts: String(c.t).split("/").map(clave).filter(Boolean), exacto: !!c.e, foto: c.foto }));
  const foto = t => {
    const n = clave(t);
    const c = concursos.find(c => c.alts.some(a => (c.exacto ? n === a : n.includes(a))));
    return c ? c.foto : "";
  };
  const CALENDARIO = '<svg class="cal" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="24" height="22" rx="3"/><path d="M4 12h24M10 3v6M22 3v6"/><path d="M9 17h3M15 17h3M21 17h2M9 22h3M15 22h3" stroke-width="2.6"/></svg>';
  const REGALO = '<svg class="regalo" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="15" width="30" height="8" rx="1.5"/><path d="M8 23v13h24V23M20 15v21"/><path d="M20 15c-3-6-10-8-10-3 0 3 6 3 10 3zM20 15c3-6 10-8 10-3 0 3-6 3-10 3z"/></svg>';

  function bono(c) {
    const factor = c.f.find(f => f[0].startsWith("Factor"));
    return `<div class="tarjeta bono compacta">
      <div class="bono-izq">
        <h3>BONO DE CUMPLIMIENTO</h3>
        <div class="bono-fila">${REGALO}<div><div class="lbl">Factor</div><div class="val">${pct(factor ? factor[1] : 0)}</div></div></div>
      </div>
      ${c.p != null ? anillo(c.p, "% Py", true) : ""}
      <div class="com"><div><div class="lbl">Comisión</div><b>${soles(c.c)}</b></div>
        ${c.r ? `<div><div class="lbl">Reconsideración</div><div class="rango">${soles(c.r)}</div></div>` : ""}</div>
    </div>`;
  }

  function tarjeta(c) {
    if (c.k === "bono") return bono(c);
    if (c.k === "cob") {
      const tasas = c.tiles.map(t => `<div class="tasa">${t[1] != null ? +(t[1] * 100).toFixed(2) + "%" : "&nbsp;"}</div>`).join("");
      const cajas = c.tiles.map(t => `<div class="cob">
          <div class="dias">${CALENDARIO}<span>&gt;${esc(t[0].toUpperCase())}</span></div>
          <div class="lbl">Cobrado</div><div class="monto">${soles(t[2])}</div>
          <div class="lbl">Comisión</div><div class="c">${soles(t[3])}</div></div>`).join("");
      return `<div class="tasas">${tasas}</div><div class="cajas-cob">${cajas}</div>
        <p class="total-cob">Comisión por cobranza: <b>${soles(c.c)}</b></p>`;
    }
    const datos = c.f.filter(f => !(c.p != null && /^% /.test(f[0])))
      .map(f => `<div><div class="lbl">${esc(f[0])}</div><div class="val">${fmt(f[1], f[2])}</div></div>`).join("");
    const extra = (c.rg ? `<div><div class="lbl">Rango</div><div class="rango">${esc(c.rg === "NO PART" ? "No participa" : titulo(c.rg))}</div></div>` : "")
      + (c.r ? `<div><div class="lbl">Reconsideración</div><div class="rango">${soles(c.r)}</div></div>` : "");
    const img = foto(c.t);
    return `<div class="tarjeta ${img ? "con-foto" : ""}">
      ${img ? `<img class="foto" src="${img}" alt="">` : ""}
      <div class="contenido">
      <h3>${esc(c.t)}</h3>${c.d ? `<p class="desc">${esc(c.d)}</p>` : '<div style="height:.45rem"></div>'}
      <div class="cuerpo ${c.p == null ? "sin-anillo" : ""} ${c.p != null && c.f.length > 5 ? "larga" : ""}">
        <div class="datos">${datos || (c.p != null ? "" : '<div class="lbl">Sin avance registrado</div>')}</div>

    </div>`;

    let seccion = "";

      if (c.s !== seccion && NOMBRE_SECCION[c.s]) html += `<h2 class="seccion">${ICONOS[c.s] || ""}${NOMBRE_SECCION[c.s]}</h2>`;
      seccion = c.s;
      html += tarjeta(c);
    }

    html += `<h2 class="seccion">${ICONOS.EJECUCION}Resumen del mes</h2>
      <div class="tarjeta resumen">
        <div class="linea"><span>Comisión generada</span><span>${soles(r.gen)}</span></div>

      html += `<div class="tarjeta resumen"><h3>Tus meses anteriores</h3><div style="height:.4rem"></div>

    }
    html += `<p class="pie">Datos al ${esc(D.meta.fecha)}. Montos referenciales sujetos a liquidación final.</p>`;

    $("detalle").innerHTML = html;
    $("login").classList.add("oculto");
    $("detalle").classList.remove("oculto");
    window.scrollTo(0, 0);
    $("salir").addEventListener("click", () => {

      $("detalle").classList.add("oculto");
      $("login").classList.remove("oculto");

    });
